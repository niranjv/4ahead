<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173e46"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>Four Ahead | Connect 4 Coach</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f5ef;color:#172e36;font:17px system-ui,sans-serif}main{max-width:960px;margin:auto;padding:20px}h1{font-size:32px;margin:0}small{color:#52666b}nav,.actions{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}button,select{font:inherit;border:1px solid #bccbc8;border-radius:12px;padding:11px 15px;background:white;color:#17363c;cursor:pointer}button.active,button.primary{background:#173e46;color:white}button:disabled{opacity:.45} .layout{display:grid;grid-template-columns:1.15fr 1fr;gap:20px}.panel{background:white;border:1px solid #dce4df;border-radius:20px;padding:18px}#board{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;background:#216a85;padding:12px;border-radius:18px}#board button{aspect-ratio:1;border:0;border-radius:50%;padding:0;background:#e8f0ef;box-shadow:inset 0 3px 5px #0003}#board button.r{background:#ef6555}#board button.y{background:#f8ca4c}#board button.mark{outline:4px solid #56e4b0;outline-offset:-4px}.numbers{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;padding:7px 12px;color:#52666b}h2{font-size:21px;margin:0 0 12px}p{line-height:1.5}#choices button{display:block;width:100%;text-align:left;margin:7px 0}.tag{font-size:13px;letter-spacing:1px;text-transform:uppercase;color:#547779;font-weight:bold}.meter{height:8px;background:#e2e9e5;border-radius:8px;overflow:hidden;margin:7px 0 13px}.meter i{display:block;background:#278b76;height:100%}#status{font-weight:650;margin:12px 0} @media(max-width:700px){.layout{grid-template-columns:1fr}main{padding:12px}.panel{padding:12px}#board{gap:5px;padding:9px}}
